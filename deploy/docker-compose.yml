# ============================================================================
# AI Diagnostic Platform — Docker Compose 完整部署
# ============================================================================
# 启动: docker compose up -d
# 停止: docker compose down
# 查看: docker compose ps
#
# 服务列表:
#   - postgres   数据库
#   - redis      缓存
#   - milvus     向量数据库 (standalone)
#   - minio      对象存储
#   - ollama     本地 LLM 服务 (可选)
#   - backend    FastAPI 后端
#   - frontend   Nginx + Vue3 前端
#   - worker     异步任务处理器 (Celery)
#   - prometheus 监控采集
#   - grafana    监控可视化
# ============================================================================

services:
  # ═══════════════════════════════════════════════════════════
  # PostgreSQL — 主数据库
  # ═══════════════════════════════════════════════════════════
  postgres:
    image: postgres:16
    container_name: ai-diagnostic-postgres
    restart: always
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: diagnostic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d diagnostic"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-diagnostic-net

  # ═══════════════════════════════════════════════════════════
  # Redis — 缓存 / 会话存储 / Celery Broker
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: ai-diagnostic-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-diagnostic-net

  # ═══════════════════════════════════════════════════════════
  # Milvus Standalone — 向量数据库（知识库 RAG）
  # 使用 etcd 内嵌模式，无需单独部署 etcd
  # ═══════════════════════════════════════════════════════════
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: ai-diagnostic-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    networks:
      - ai-diagnostic-net

  # ═══════════════════════════════════════════════════════════
  # MinIO — 对象存储（日志文件 / 附件）
  # Web Console: http://localhost:9001
  # ═══════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: ai-diagnostic-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-diagnostic-net

  # ═══════════════════════════════════════════════════════════
  # Ollama — 本地 LLM 推理服务（可选，替代云端 API）
  # 需在首次启动后手动拉取模型: docker exec ai-diagnostic-ollama ollama pull qwen2:7b
  # ═══════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: ai-diagnostic-ollama
    restart: always
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "4"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ai-diagnostic-net
    profiles:
      - gpu  # 仅在使用 --profile gpu 时启动

  # ═══════════════════════════════════════════════════════════
  # Backend — FastAPI 后端
  # ═══════════════════════════════════════════════════════════
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ai-diagnostic-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # ── 数据库 ─────────────────────────────────────
      DATABASE_URL: postgresql://ai:ai@postgres:5432/diagnostic
      REDIS_URL: redis://redis:6379/0
      # ── 上传 ───────────────────────────────────────
      UPLOAD_DIR: /app/data/raw
      # ── LLM ────────────────────────────────────────
      LLM_PROVIDER: mock
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1/chat/completions
      DEEPSEEK_MODEL: deepseek-chat
      # ── Milvus ─────────────────────────────────────
      MILVUS_ENABLED: "true"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: knowledge_docs
      MILVUS_DIM: "1536"
      MILVUS_USER: ""
      MILVUS_PASSWORD: ""
      # ── Embedding ──────────────────────────────────
      EMBEDDING_PROVIDER: deepseek
      EMBEDDING_BATCH_SIZE: "32"
      # ── MinIO ──────────────────────────────────────
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: diagnostic-logs
      MINIO_SECURE: "false"
      # ── Ollama (可选) ─────────────────────────────
      OLLAMA_ENABLED: "false"
      OLLAMA_HOST: http://ollama:11434
      # ── Worker ─────────────────────────────────────
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # ── 安全 ──────────────────────────────────────
      SECRET_KEY: "${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_GENERATE_RANDOM_64_CHAR}"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "60"
      LOG_DESENSITIZE_ENABLED: "true"
      # ── 监控 ──────────────────────────────────────
      PROMETHEUS_METRICS_ENABLED: "true"
      # ── 应用 ──────────────────────────────────────
      APP_NAME: AI Diagnostic Platform
      VERSION: "1.0.0"
      DEBUG: "false"
      LOG_LEVEL: INFO
    volumes:
      - upload_data:/app/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ai-diagnostic-net

  # ═══════════════════════════════════════════════════════════
  # Worker — 异步任务处理器 (Celery)
  # 处理日志解析、向量索引构建等耗时任务
  # ═══════════════════════════════════════════════════════════
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ai-diagnostic-worker
    restart: always
    # 启动 Celery worker
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      --queues=default,parsing,indexing,analysis
    environment:
      DATABASE_URL: postgresql://ai:ai@postgres:5432/diagnostic
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      UPLOAD_DIR: /app/data/raw
      LLM_PROVIDER: mock
      MILVUS_ENABLED: "true"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION: knowledge_docs
      MILVUS_DIM: "1536"
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: diagnostic-logs
      MINIO_SECURE: "false"
      SECRET_KEY: "${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_GENERATE_RANDOM_64_CHAR}"
      DEBUG: "false"
      LOG_LEVEL: INFO
    volumes:
      - upload_data:/app/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-diagnostic-net

  # ═══════════════════════════════════════════════════════════
  # Frontend — Nginx + Vue3 SPA
  # ═══════════════════════════════════════════════════════════
  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: ai-diagnostic-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ai-diagnostic-net

  # ═══════════════════════════════════════════════════════════
  # Prometheus — 监控指标采集
  # Web UI: http://localhost:9090
  # ═══════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ai-diagnostic-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai-diagnostic-net

  # ═══════════════════════════════════════════════════════════
  # Grafana — 监控可视化仪表盘
  # Web UI: http://localhost:3000 (admin/admin)
  # ═══════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ai-diagnostic-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard-backend.json:/etc/grafana/provisioning/dashboards/backend.json:ro
      - ./monitoring/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./monitoring/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
    depends_on:
      - prometheus
    networks:
      - ai-diagnostic-net

# ═══════════════════════════════════════════════════════════
# 持久化卷
# ═══════════════════════════════════════════════════════════
volumes:
  postgres_data:
  redis_data:
  upload_data:
  milvus_data:
  minio_data:
  ollama_data:
  prometheus_data:
  grafana_data:

# ═══════════════════════════════════════════════════════════
# 网络
# ═══════════════════════════════════════════════════════════
networks:
  ai-diagnostic-net:
    driver: bridge
