apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-diagnostic

resources:
  - ../../base

namePrefix: staging-

patches:
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
  - patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.ai-diagnostic.example.com
    target:
      kind: Ingress
      name: platform-ingress
  - patch: |
      - op: replace
        path: /spec/rules/1/host
        value: staging.ai-diagnostic.example.com
    target:
      kind: Ingress
      name: platform-ingress

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LLM_PROVIDER=mock
      - MILVUS_ENABLED=false
      - MINIO_ENABLED=false
      - OLLAMA_ENABLED=false
      - RATE_LIMIT_ENABLED=false
      - PROMETHEUS_METRICS_ENABLED=false
      - LOG_DESENSITIZE_ENABLED=false
