# 本地 Docker Desktop K8s 部署 — Kustomize 配置
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-diagnostic

# 使用独立的本地 deployment 文件（非继承 base）
resources:
  - deployment.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: ai-diagnostic-platform

configMapGenerator:
  - name: backend-config
    options:
      disableNameSuffixHash: true
    literals:
      - APP_NAME=AI Diagnostic Platform
      - VERSION=1.0.0
      - DEBUG=true
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=mock
      - DEEPSEEK_MODEL=deepseek-chat
      - EMBEDDING_PROVIDER=mock
      - MILVUS_ENABLED=false
      - UPLOAD_DIR=/data/uploads
      - PROMETHEUS_METRICS_ENABLED=false
      - RATE_LIMIT_ENABLED=false
      - RATE_LIMIT_PER_MINUTE=600
      - LOG_DESENSITIZE_ENABLED=false
generatorOptions:
  disableNameSuffixHash: true
