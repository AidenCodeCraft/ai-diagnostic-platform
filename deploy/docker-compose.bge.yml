# ============================================================================
# AI Diagnostic Platform — 本地 BGE 嵌入 Compose 覆盖文件（Docker 内运行 BGE）
# ============================================================================
#
# 适用场景
#   - 后端镜像内需要「真实本地 BGE 语义嵌入」（BAAI/bge-small-zh-v1.5，512 维），
#     而不是云端 Embedding API，也不是 hash 词形嵌入兜底；
#   - 内网 / 离线部署：镜像构建时装入 torch + sentence-transformers，运行时只读
#     挂载宿主机已下载好的 HuggingFace 模型缓存，完全离线加载。
#
# 前置条件（重要）
#   1) 宿主机已缓存 BGE 模型（~92MB）到 HF 缓存根目录：
#        # Windows PowerShell
#        $env:HF_ENDPOINT = 'https://hf-mirror.com'
#        & ..\.venv\Scripts\python.exe -c "from huggingface_hub import snapshot_download; print(snapshot_download('BAAI/bge-small-zh-v1.5'))"
#        # Linux/macOS
#        HF_ENDPOINT=https://hf-mirror.com python -c "from huggingface_hub import snapshot_download; print(snapshot_download('BAAI/bge-small-zh-v1.5'))"
#      缓存根目录下应能看到：models--BAAI--bge-small-zh-v1.5/snapshots/<commit>/
#      （默认路径：Windows %USERPROFILE%\.cache\huggingface；Linux ~/.cache/huggingface）
#   2) HF_CACHE_DIR 必须指向「缓存根目录」（即包含 models--BAAI--... 的目录）：
#        Windows PowerShell : $env:HF_CACHE_DIR = "$env:USERPROFILE\.cache\huggingface"
#        Linux/macOS        : export HF_CACHE_DIR="$HOME/.cache/huggingface"
#      未设置时，本文件会直接报错（compose 变量必填校验）。
#   3) 首次构建镜像需额外安装 torch + sentence-transformers（镜像 +2GB 以上，
#      构建耗时数分钟～十几分钟，取决于网络/镜像源），构建后的镜像可复用。
#
# 构建 / 启动命令（在仓库根目录执行；与基础 compose 叠加）
#   Windows PowerShell:
#     $env:HF_CACHE_DIR = "$env:USERPROFILE\.cache\huggingface"
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bge.yml up -d --build backend worker
#   Linux/macOS:
#     export HF_CACHE_DIR="$HOME/.cache/huggingface"
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bge.yml up -d --build backend worker
#
#   只重建后端镜像（不启动其它服务）：
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bge.yml build backend
#
#   校验合并后的配置（不构建、不启动）：
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bge.yml config
#
# 本文件对基础 compose 的改动（override 语义，不改基础文件）
#   - backend / worker：build.args.INSTALL_ML=true（基础 compose 默认 false，
#     由 backend/Dockerfile 的 ARG INSTALL_ML 决定是否 pip install requirements-ml.txt）；
#   - backend / worker：EMBEDDING_PROVIDER=local（强制本地 BGE，不走 api/auto 分支）；
#   - backend / worker：EMBEDDING_LOAD_TIMEOUT=120（默认 30s 对 CPU 冷加载偏紧，
#     超时会静默回退 hash 嵌入）；
#   - backend / worker：HF_HUB_OFFLINE=1 + TRANSFORMERS_OFFLINE=1（只读本地缓存，
#     绝不访问 huggingface.co；注意：即使模型已缓存，transformers 对 repo id 仍会做
#     adapter 元数据探测，被墙环境不设离线变量会长时间挂起）；
#   - backend / worker：只读挂载 ${HF_CACHE_DIR} -> /root/.cache/huggingface:ro；
#   - HF_ENDPOINT 仅作「若显式关闭离线模式」时的后备镜像，离线模式下不会使用。
#
# 容器内预热 / 验收判定
#   1) 预热（可选，强烈建议在接流量前执行，避免首个请求等待模型加载）：
#        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bge.yml \
#          exec backend python -c "from app.services.knowledge.embedding import get_embedder; e=get_embedder(); print(e.provider_name, e.dimension)"
#      期望输出：BGEEmbedder 512
#   2) 接口验证：
#        curl -s -X POST http://localhost:8000/api/v1/vector/embed \
#             -H "Content-Type: application/json" -d '{"text":"USB 设备超时无响应"}'
#      期望：dimension=512 且 embedding 非全零；
#        curl -s http://localhost:8000/api/v1/vector/health
#      期望：Milvus 可用、embedding 提供者为 BGEEmbedder（而非 HashingEmbedder）。
#   3) 日志判定：
#        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bge.yml logs backend | grep -E "Using local BGE|BGEEmbedder|hash"
#      出现 "[Embedding] Using local BGE embedder (dim=512)" 即成功；
#      若出现 "使用哈希嵌入兜底"，说明本地 BGE 未生效（检查镜像是否含
#      sentence-transformers、缓存是否挂载、HF_HUB_OFFLINE 配置）。
#   4) 构建参数核验（不启动容器）：
#        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bge.yml config | grep -E "INSTALL_ML|EMBEDDING_PROVIDER|HF_HUB_OFFLINE"
#      期望：INSTALL_ML: "true"、EMBEDDING_PROVIDER: local、HF_HUB_OFFLINE: "1"。
#
# 回滚（恢复默认：hash/云端嵌入，镜像不含 ML 依赖）
#   不要叠加本文件即可：docker compose -f deploy/docker-compose.yml up -d --build backend worker
# ============================================================================

services:
  # ═══════════════════════════════════════════════════════════
  # Backend — 真实本地 BGE 嵌入
  # ═══════════════════════════════════════════════════════════
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        # 让 backend/Dockerfile 在 builder 阶段安装 requirements-ml.txt
        # （torch + sentence-transformers；基础 compose 默认 "false"）
        INSTALL_ML: "true"
    environment:
      # 强制本地 BGE（auto 在无 ST 依赖时也会静默回退 hash）
      EMBEDDING_PROVIDER: local
      # CPU 冷加载实测 15s+（容器冷启动更慢），30s 默认值容易超时回退 hash
      EMBEDDING_LOAD_TIMEOUT: "${EMBEDDING_LOAD_TIMEOUT:-120}"
      # 只读本地缓存，完全离线（避免 huggingface.co 被墙时 adapter 探测挂起）
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # 后备镜像：仅当显式关闭离线模式时才可能被使用
      HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
      # 可选：让本地 BGE 加载失败时硬失败（默认 true=静默回退 hash，便于先跑通）
      # EMBEDDING_HASH_FALLBACK: "false"
    volumes:
      # 只读挂载宿主机 HF 缓存（长语法：兼容 Windows 盘符路径，且显式 read_only）
      - type: bind
        source: "${HF_CACHE_DIR:?请先设置 HF_CACHE_DIR 指向 HuggingFace 缓存根目录。Windows PowerShell 示例: HF_CACHE_DIR=%USERPROFILE%\\.cache\\huggingface}"
        target: /root/.cache/huggingface
        read_only: true

  # ═══════════════════════════════════════════════════════════
  # Worker — 与 backend 共用镜像，保持同一嵌入配置
  # （当前 worker 为 keep-alive 占位进程；后续启用 Celery 任务时避免降级 hash）
  # ═══════════════════════════════════════════════════════════
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        INSTALL_ML: "true"
    environment:
      EMBEDDING_PROVIDER: local
      EMBEDDING_LOAD_TIMEOUT: "${EMBEDDING_LOAD_TIMEOUT:-120}"
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
    volumes:
      - type: bind
        source: "${HF_CACHE_DIR:?请先设置 HF_CACHE_DIR 指向 HuggingFace 缓存根目录。Windows PowerShell 示例: HF_CACHE_DIR=%USERPROFILE%\\.cache\\huggingface}"
        target: /root/.cache/huggingface
        read_only: true
