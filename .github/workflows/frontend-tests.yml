name: frontend-tests

on:
  push:
    branches: ["master", "feat/**", "feature-*"]
    paths:
      - "apps/web/**"
  pull_request:
    paths:
      - "apps/web/**"
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Type check
        working-directory: apps/web
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: npm run build
