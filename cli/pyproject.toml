[project]
name = "ai-diagnostic-cli"
version = "1.0.0"
description = "AI Diagnostic Platform - CLI tool and Python SDK"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
diag = "ai_diagnostic.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-httpx"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
